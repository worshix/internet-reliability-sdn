<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAN — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="zan-login-body">
  <div class="zan-login-wrapper">
    <div class="zan-login-card">
      <div class="zan-login-logo">
        <i class="bi bi-broadcast-pin"></i>
      </div>
      <h1 class="zan-login-title">ZAN Network</h1>
      <p class="zan-login-subtitle">Zimbabwe Adaptive Network — Admin Portal</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert zan-alert-{{ cat }} mb-3">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="zan-label" for="username">
            <i class="bi bi-person me-1"></i>Username
          </label>
          <input type="text" id="username" name="username" class="form-control zan-input"
                 placeholder="admin" required autofocus>
        </div>
        <div class="mb-4">
          <label class="zan-label" for="password">
            <i class="bi bi-lock me-1"></i>Password
          </label>
          <input type="password" id="password" name="password" class="form-control zan-input"
                 placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn zan-btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
        </button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
