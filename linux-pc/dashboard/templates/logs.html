{% extends "base.html" %}
{% block title %}Node Logs{% endblock %}

{% block content %}
<div class="row mt-2 mb-3">
  <div class="col d-flex align-items-center justify-content-between">
    <h5 class="zan-page-title mb-0">
      <i class="bi bi-journal-text me-2"></i>Live Node Logs
    </h5>
    <div class="d-flex gap-2 align-items-center">
      <select id="log-filter-node" class="zan-select form-select form-select-sm w-auto">
        <option value="">All nodes</option>
        <option value="esp32_01">esp32_01</option>
        <option value="esp32_02">esp32_02</option>
        <option value="esp32_03">esp32_03</option>
        <option value="esp32_04">esp32_04</option>
      </select>
      <div class="form-check form-switch mb-0 ms-2">
        <input class="form-check-input" type="checkbox" id="log-autoscroll" checked>
        <label class="form-check-label zan-label" for="log-autoscroll">Auto-scroll</label>
      </div>
      <button class="btn zan-btn-sm" onclick="ZAN.clearLogDisplay()">
        <i class="bi bi-trash me-1"></i>Clear view
      </button>
    </div>
  </div>
</div>

<!-- Live log counter -->
<div class="row mb-2">
  <div class="col">
    <div class="zan-log-stats">
      <span><i class="bi bi-reception-4 me-1 text-success"></i>
        Receiving live — <strong id="log-count">0</strong> entries
      </span>
      <span class="ms-3 zan-text-muted" id="log-last-ts">Last: —</span>
    </div>
  </div>
</div>

<!-- Log table -->
<div class="zan-card p-0">
  <div class="zan-log-container" id="log-container">
    <table class="table zan-log-table mb-0" id="log-table">
      <thead class="zan-log-thead">
        <tr>
          <th>Time</th>
          <th>From</th>
          <th>To</th>
          <th>Latency</th>
          <th>RSSI</th>
          <th>Pkt Loss</th>
          <th>Uptime</th>
          <th>Raw JSON</th>
        </tr>
      </thead>
      <tbody id="log-body">
        <tr id="log-placeholder">
          <td colspan="8" class="zan-no-alerts">
            <i class="bi bi-hourglass-split me-2"></i>Waiting for MQTT messages…
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>ZAN.initLogs();</script>
{% endblock %}
